# Flutter Launcher Icons Configuration
# Note: Place your 1024x1024 px icon at assets/icon/icon.png
# Then run: flutter pub get && flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true  # iOS icons enabled
  image_path: "assets/icon/icon.png"  # 1024x1024 px master icon for Android (JPG or PNG)
  image_path_ios: "assets/icon/ios/icon.png"  # 1024x1024 px master icon for iOS
  adaptive_icon_background: "#E0E0E0"  # Light gray (matches your icon background)
  # Note: If you have a separate foreground layer, uncomment the line below:
  # adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21  # Android 5.0+
