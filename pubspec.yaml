name: hemoai
description: "HemoAI - Smart Hemogram Analysis & Health Tracking with AI-powered insights"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 4.0.0+400

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.3.0
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.0.4
  firebase_performance: ^0.10.1+10
  firebase_analytics: ^11.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.0
  encrypt: ^5.0.3
  
  
  # Legacy state management (OS-3 stack)
  provider: ^6.1.2
  country_picker: ^2.0.21
  
  # Modern State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # UI & Design System
  cupertino_icons: ^1.0.8
  # material_color_utilities is provided by Flutter SDK; no direct dep needed
  
  # Data Persistence & Database
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.18
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.8.3
  
  # Local Storage & Preferences
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking & APIs
  dio: ^5.7.0
  http: ^1.2.2
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.1.5
  
  # Charts & Data Visualization
  fl_chart: ^0.69.0
  
  # PDF & Document Generation
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  
  # File Operations
  share_plus: ^10.1.1
  open_filex: ^4.5.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  
  # AI & Machine Learning
  google_mlkit_text_recognition: ^0.13.0
  tflite_flutter: ^0.10.4
  
  # Security & Encryption
  cryptography: ^2.7.0
  local_auth: ^2.3.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.0
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  flutter_contacts: ^1.1.7
  
  # Payments
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.1
  
  # Animations & UI Enhancements
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  
  # Background Tasks
  workmanager: ^0.9.0+3
  
  # Cloud & Sync
  supabase_flutter: ^2.8.0
  
  # Health & Fitness (optional)
  # health: ^11.3.0 # Temporarily disabled due to unavailable version; re-enable with a valid version when needed
  permission_handler: ^11.3.1
