<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemoAI Support</title>
    <style>
        :root {
            --primary-color: #E53E3E;
            --primary-dark: #C53030;
            --bg-light: #f7fafc;
            --bg-dark: #1a202c;
            --text-light: #1a202c;
            --text-dark: #edf2f7;
            --card-light: #ffffff;
            --card-dark: #2d3748;
            --border-light: #e2e8f0;
            --border-dark: #4a5568;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--primary-color);
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #languageSelector {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-light);
            background-color: var(--card-light);
            color: var(--text-light);
            cursor: pointer;
        }
        .dark-mode #languageSelector {
            border-color: var(--border-dark);
            background-color: var(--card-dark);
            color: var(--text-dark);
        }
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
        }
        .theme-switch {
            display: inline-block;
            height: 24px;
            position: relative;
            width: 44px;
        }
        .theme-switch input {
            display:none;
        }
        .slider {
            background-color: #ccc;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            background-color: #fff;
            bottom: 4px;
            content: "";
            height: 16px;
            left: 4px;
            position: absolute;
            transition: .4s;
            width: 16px;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary-color);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .card {
            background-color: var(--card-light);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .dark-mode .card {
            background-color: var(--card-dark);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            background-color: var(--bg-light);
            color: var(--text-light);
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .dark-mode .form-group input,
        .dark-mode .form-group textarea {
            background-color: var(--bg-dark);
            color: var(--text-dark);
            border-color: var(--border-dark);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(229, 62, 62, 0.3);
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 6px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: var(--primary-dark);
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: #a0aec0;
        }
        .footer a {
            color: #a0aec0;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer a:hover {
            text-decoration: underline;
            color: var(--primary-color);
        }
        #form-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        #form-status.success {
            background-color: #c6f6d5;
            color: #22543d;
            display: block;
        }
        #form-status.error {
            background-color: #fed7d7;
            color: #742a2a;
            display: block;
        }

        /* RTL support for Arabic */
        html[dir="rtl"] body {
            text-align: right;
        }
        html[dir="rtl"] .header {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .controls {
            gap: 15px;
        }
        html[dir="rtl"] .slider:before {
            left: auto;
            right: 4px;
        }
        html[dir="rtl"] input:checked + .slider:before {
            transform: translateX(-20px);
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 data-lang="title">HemoAI Support</h1>
            <div class="controls">
                <select id="languageSelector" aria-label="Language">
                    <option value="en">English</option>
                    <option value="tr">Türkçe</option>
                    <option value="es">Español</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                </select>
                <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="theme-checkbox">
                        <input type="checkbox" id="theme-checkbox" />
                        <div class="slider"></div>
                    </label>
                </div>
            </div>
        </div>

        <div class="card">
            <p data-lang="description" style="margin-top:0; margin-bottom:30px; line-height:1.6;">Welcome to the HemoAI support page. If you have any problems, questions, or suggestions, please fill out the form below. We will get back to you as soon as possible.</p>
            
            <form id="supportForm" action="https://formspree.io/f/xpwovdpp" method="POST">
                <div class="form-group">
                    <label for="name" data-lang="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email" data-lang="email">Your Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject" data-lang="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message" data-lang="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="submit-btn" data-lang="submit">Send Message</button>
            </form>
            <div id="form-status"></div>
        </div>

        <div class="footer">
            <p>© 2024 HemoAI. All rights reserved.</p>
            <p>
                <a href="https://meloshemo.github.io/hemoai-privacy/" target="_blank" data-lang="privacy">Privacy Policy</a>
                <a href="https://meloshemo.github.io/hemoai-terms/" target="_blank" data-lang="terms">Terms of Use</a>
            </p>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "HemoAI Support",
                description: "Welcome to the HemoAI support page. If you have any problems, questions, or suggestions, please fill out the form below. We will get back to you as soon as possible.",
                name: "Your Name",
                email: "Your Email",
                subject: "Subject",
                message: "Message",
                submit: "Send Message",
                privacy: "Privacy Policy",
                terms: "Terms of Use",
                successMsg: "Thank you for your message! We will get back to you soon.",
                errorMsg: "Oops! There was a problem submitting your form. Please try again later.",
                dir: "ltr"
            },
            tr: {
                title: "HemoAI Destek",
                description: "HemoAI destek sayfasına hoş geldiniz. Bir sorununuz, sorunuz veya öneriniz varsa lütfen aşağıdaki formu doldurun. Size en kısa sürede geri dönüş yapacağız.",
                name: "Adınız",
                email: "E-posta Adresiniz",
                subject: "Konu",
                message: "Mesajınız",
                submit: "Mesajı Gönder",
                privacy: "Gizlilik Politikası",
                terms: "Kullanım Koşulları",
                successMsg: "Mesajınız için teşekkür ederiz! Size en kısa sürede geri döneceğiz.",
                errorMsg: "Formunuz gönderilirken bir sorun oluştu. Lütfen daha sonra tekrar deneyin.",
                dir: "ltr"
            },
            es: {
                title: "Soporte de HemoAI",
                description: "Bienvenido a la página de soporte de HemoAI. Si tienes algún problema, pregunta o sugerencia, por favor completa el formulario a continuación. Nos pondremos en contacto contigo lo antes posible.",
                name: "Tu Nombre",
                email: "Tu Correo Electrónico",
                subject: "Asunto",
                message: "Mensaje",
                submit: "Enviar Mensaje",
                privacy: "Política de Privacidad",
                terms: "Términos de Uso",
                successMsg: "¡Gracias por tu mensaje! Nos pondremos en contacto contigo pronto.",
                errorMsg: "¡Ups! Hubo un problema al enviar tu formulario. Por favor, inténtalo de nuevo más tarde.",
                dir: "ltr"
            },
            ru: {
                title: "Поддержка HemoAI",
                description: "Добро пожаловать на страницу поддержки HemoAI. Если у вас есть проблемы, вопросы или предложения, пожалуйста, заполните форму ниже. Мы свяжемся с вами как можно скорее.",
                name: "Ваше Имя",
                email: "Ваш Email",
                subject: "Тема",
                message: "Сообщение",
                submit: "Отправить Сообщение",
                privacy: "Политика Конфиденциальности",
                terms: "Условия Использования",
                successMsg: "Спасибо за ваше сообщение! Мы свяжемся с вами в ближайшее время.",
                errorMsg: "Ой! Возникла проблема при отправке формы. Пожалуйста, попробуйте еще раз позже.",
                dir: "ltr"
            },
            ar: {
                title: "دعم HemoAI",
                description: "مرحبًا بك في صفحة دعم HemoAI. إذا كانت لديك أي مشاكل أو أسئلة أو اقتراحات، يرجى ملء النموذج أدناه. سوف نرد عليك في أقرب وقت ممكن.",
                name: "اسمك",
                email: "بريدك الإلكتروني",
                subject: "الموضوع",
                message: "رسالتك",
                submit: "إرسال الرسالة",
                privacy: "سياسة الخصوصية",
                terms: "شروط الاستخدام",
                successMsg: "شكرا لرسالتك! سوف نرد عليك قريبا.",
                errorMsg: "عفوًا! حدثت مشكلة أثناء إرسال النموذج. يرجى المحاولة مرة أخرى لاحقًا.",
                dir: "rtl"
            },
            fr: {
                title: "Support HemoAI",
                description: "Bienvenue sur la page de support de HemoAI. Si vous avez des problèmes, des questions ou des suggestions, veuillez remplir le formulaire ci-dessous. Nous vous répondrons dans les plus brefs délais.",
                name: "Votre Nom",
                email: "Votre E-mail",
                subject: "Sujet",
                message: "Message",
                submit: "Envoyer le Message",
                privacy: "Politique de Confidentialité",
                terms: "Conditions d'Utilisation",
                successMsg: "Merci pour votre message ! Nous vous recontacterons bientôt.",
                errorMsg: "Oups ! Un problème est survenu lors de l'envoi de votre formulaire. Veuillez réessayer plus tard.",
                dir: "ltr"
            },
            de: {
                title: "HemoAI-Support",
                description: "Willkommen auf der Support-Seite von HemoAI. Bei Problemen, Fragen oder Anregungen füllen Sie bitte das folgende Formular aus. Wir werden uns so schnell wie möglich bei Ihnen melden.",
                name: "Ihr Name",
                email: "Ihre E-Mail",
                subject: "Betreff",
                message: "Nachricht",
                submit: "Nachricht Senden",
                privacy: "Datenschutzrichtlinie",
                terms: "Nutzungsbedingungen",
                successMsg: "Vielen Dank für Ihre Nachricht! Wir werden uns bald bei Ihnen melden.",
                errorMsg: "Hoppla! Beim Senden Ihres Formulars ist ein Problem aufgetreten. Bitte versuchen Sie es später erneut.",
                dir: "ltr"
            },
            it: {
                title: "Supporto HemoAI",
                description: "Benvenuto nella pagina di supporto di HemoAI. Se hai problemi, domande o suggerimenti, compila il modulo sottostante. Ti risponderemo il prima possibile.",
                name: "Il Tuo Nome",
                email: "La Tua Email",
                subject: "Oggetto",
                message: "Messaggio",
                submit: "Invia Messaggio",
                privacy: "Informativa sulla Privacy",
                terms: "Termini di Utilizzo",
                successMsg: "Grazie per il tuo messaggio! Ti risponderemo presto.",
                errorMsg: "Oops! Si è verificato un problema durante l'invio del modulo. Riprova più tardi.",
                dir: "ltr"
            },
            pt: {
                title: "Suporte HemoAI",
                description: "Bem-vindo à página de suporte da HemoAI. Se tiver algum problema, dúvida ou sugestão, por favor, preencha o formulário abaixo. Entraremos em contato o mais breve possível.",
                name: "Seu Nome",
                email: "Seu Email",
                subject: "Assunto",
                message: "Mensagem",
                submit: "Enviar Messagem",
                privacy: "Política de Privacidade",
                terms: "Termos de Uso",
                successMsg: "Obrigado pela sua mensagem! Entraremos em contato em breve.",
                errorMsg: "Opa! Ocorreu um problema ao enviar seu formulário. Por favor, tente novamente mais tarde.",
                dir: "ltr"
            }
        };

        // --- Theme Manager ---
        const themeCheckbox = document.getElementById('theme-checkbox');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme) {
            document.body.classList.add(currentTheme);
            if (currentTheme === 'dark-mode') {
                themeCheckbox.checked = true;
            }
        }

        themeCheckbox.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }
        });

        // --- Language Manager ---
        const languageSelector = document.getElementById('languageSelector');
        
        function setLanguage(lang) {
            const langData = translations[lang];
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (langData[key]) {
                    el.textContent = langData[key];
                }
            });
            document.documentElement.lang = lang;
            document.documentElement.dir = langData.dir || 'ltr';
            localStorage.setItem('language', lang);
        }

        const savedLang = localStorage.getItem('language') || navigator.language.split('-')[0];
        if (translations[savedLang]) {
            languageSelector.value = savedLang;
            setLanguage(savedLang);
        } else {
            setLanguage('en');
        }

        languageSelector.addEventListener('change', (event) => {
            setLanguage(event.target.value);
        });

        // --- Formspree Handler ---
        const form = document.getElementById('supportForm');
        const statusDiv = document.getElementById('form-status');
        
        async function handleSubmit(event) {
            event.preventDefault();
            const data = new FormData(event.target);
            const lang = localStorage.getItem('language') || 'en';
            
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    statusDiv.innerHTML = translations[lang].successMsg;
                    statusDiv.className = 'success';
                    form.reset();
                } else {
                    response.json().then(data => {
                        statusDiv.innerHTML = translations[lang].errorMsg;
                        if (Object.hasOwn(data, 'errors')) {
                           statusDiv.innerHTML += "<br>" + data["errors"].map(error => error["message"]).join(", ");
                        }
                        statusDiv.className = 'error';
                    })
                }
            }).catch(error => {
                statusDiv.innerHTML = translations[lang].errorMsg;
                statusDiv.className = 'error';
            });
        }
        form.addEventListener("submit", handleSubmit);

    </script>
</body>
</html>
